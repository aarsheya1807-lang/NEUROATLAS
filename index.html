<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Neuromap — Interactive Brain Atlas</title>
<meta name="description" content="Neuromap: an interactive 3D brain atlas bridging spatial anatomy with psychological and clinical function." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <header>
    <div class="wordmark">NEURO<span class="dot">MAP</span><span class="tag">interactive atlas</span></div>
    <button id="sidebar-toggle" aria-label="Toggle region list">☰</button>
  </header>

  <aside id="sidebar">
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search a structure, function, or syndrome…" autocomplete="off" />
    </div>
    <nav class="region-list" id="region-list" aria-label="Brain regions"></nav>
    <div class="sidebar-footer">
      <span id="region-count">— regions</span>
      <span>rotate · scroll · click</span>
    </div>
  </aside>

  <main id="viewport">
    <div id="canvas-host"></div>

    <div class="hint">drag to rotate · scroll to zoom · click a structure</div>

    <div class="viewport-controls">
      <button class="vc-btn" id="btn-reset">↺ reset view</button>
      <button class="vc-btn" id="btn-quiz">◎ pinpoint mode</button>
    </div>

    <div id="quiz-bar">
      <span id="quiz-prompt">Click on: <strong>—</strong></span>
      <span id="quiz-timer">5.0s</span>
      <span id="quiz-score">0 / 0</span>
      <button id="quiz-end-btn">end</button>
    </div>
    <div id="quiz-feedback"></div>

    <section id="info-panel" aria-live="polite">
      <button id="info-close" aria-label="Close">✕</button>
      <div class="info-eyebrow" id="info-category">—</div>
      <h2 class="info-title" id="info-name">—</h2>
      <div class="info-brodmann" id="info-brodmann"></div>
      <div class="info-section-label">Function</div>
      <p class="info-body" id="info-function"></p>
      <div class="info-section-label">Clinical Correlation</div>
      <p class="info-clinical" id="info-clinical"></p>
    </section>

    <div id="toast"></div>
  </main>

</div>

<!-- Three.js core + orbit controls, loaded before app.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- App logic — fetches brainData.json itself, no separate data script needed -->
<script src="app.js"></script>
</body>
</html>
