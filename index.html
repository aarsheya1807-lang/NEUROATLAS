<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroMap 3D | Interactive Brain Explorer</title>
  
  <!-- Importmap for Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-panel {
      position: absolute;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    #top-bar {
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-selector {
      display: flex;
      gap: 10px;
    }

    button, select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    select option {
      background: #1e293b;
      color: #fff;
    }

    button:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    button.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    /* Inspector Sidebar */
    #inspector {
      top: 90px;
      right: 20px;
      width: 380px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }

    .select-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #region-select {
      width: 100%;
      margin-bottom: 16px;
    }

    .struct-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .badge-normal { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .badge-lesion { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .section-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .diagnostic-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .diagnostic-box header {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .clinical-box {
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--danger);
      padding: 12px;
      border-radius: 0 6px 6px 0;
      margin-top: 14px;
      font-size: 0.85rem;
    }

    /* Game Mode Banner */
    #game-banner {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 620px;
      max-width: 90vw;
      text-align: center;
      display: none;
    }

    #game-banner.active { display: block; }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      background: #dc2626;
      color: #fff;
    }

    #inspector::-webkit-scrollbar { width: 6px; }
    #inspector::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Navigation Bar -->
  <div id="top-bar" class="ui-panel">
    <div class="brand">🧠 NeuroMap 3D</div>
    <div class="mode-selector">
      <button id="btn-explore" class="active" onclick="setMode('explore')">Explore Mode</button>
      <button id="btn-lesion" onclick="setMode('lesion')">Virtual Lesion Mode</button>
      <button id="btn-game" onclick="setMode('game')">Neuro-Detective Game</button>
    </div>
  </div>

  <!-- Inspector Sidebar -->
  <div id="inspector" class="ui-panel">
    <label class="select-label" for="region-select">Select Brain Region (20 Structures)</label>
    <select id="region-select" onchange="onSelectDropdown(this.value)">
      <option value="">-- Choose a Region --</option>
    </select>

    <div id="struct-name" class="struct-title">Select a Region</div>
    <div id="status-badge" class="badge badge-normal">Healthy State</div>
    <div id="struct-desc" class="section-desc">Click on any 3D brain region or choose one from the dropdown menu to examine its clinical and anatomical profile.</div>

    <div id="dsm-container" class="diagnostic-box" style="display: none;">
      <header>DSM-5-TR Diagnostic Correlation</header>
      <div id="dsm-text"></div>
    </div>

    <div id="icd-container" class="diagnostic-box" style="display: none;">
      <header>ICD-11 Classification</header>
      <div id="icd-text"></div>
    </div>

    <div id="clinical-block" class="clinical-box" style="display: none;">
      <strong>Lesion Deficit Profile:</strong>
      <p id="struct-clinical" style="margin-top: 4px;"></p>
    </div>

    <div id="action-controls" style="margin-top: 16px; display: none;">
      <button id="btn-toggle-lesion" class="btn-danger" style="width: 100%;" onclick="toggleCurrentLesion()">Apply Virtual Lesion</button>
    </div>
  </div>

  <!-- Game Overlay Panel -->
  <div id="game-banner" class="ui-panel">
    <h3 style="color: var(--accent); margin-bottom: 6px;">Neuro-Detective Clinical Case</h3>
    <p id="game-case-text" style="font-size: 0.95rem; margin-bottom: 12px; color: var(--text-muted);"></p>
    <div id="game-feedback" style="font-weight: 600; margin-bottom: 8px; min-height: 20px;"></div>
    <button onclick="nextGameCase()">Next Case</button>
  </div>

  <!-- Three.js Logic -->
  <script type="module">

        pos: [0.8, -0.8, -0.4],

        icd: '6C20 Somatic distress disorder'
      },
      {
        id: 'insula',
        name: 'Insular Cortex (Insula)',
        pos: [-0.8, 0.3, 0.1],
        scale: [0.3, 0.4, 0.5],

        lesionDeficit: 'Loss of bodily interoceptive awareness, blunted disgust responses, altered pain perception.',

        icd: '6B01 Panic disorder / 6B80 Anorexia nervosa'
      },
      {
        id: 'basal_ganglia_caudate',
        name: 'Caudate Nucleus',
        pos: [0.4, 0.4, 0.3],
        scale: [0.35, 0.5, 0.4],
        color: 0xfdcb6e,

      {

        color: 0x6c5ce7,

        icd: '6B40 Post traumatic stress disorder / 6B01 Panic disorder'
      },
      {
        id: 'raphe_nuclei',
        name: 'Raphe Nuclei',
        pos: [0.0, -0.6, -0.4],
        scale: [0.2, 0.3, 0.2],
        color: 0xfd79a8,
        function: 'Primary serotonergic center regulating mood stability, sleep-wake architecture, and impulse control.',
        lesionDeficit: 'Severe affective dysregulation, insomnia, heightened impulsive aggression.',
        dsm: 'Major Depressive Episode / Intermittent Explosive Disorder (312.34)',
        icd: '6A70 Major depressive disorder / 6C91 Intermittent explosive disorder'
      },
      {

        name: 'Suprachiasmatic Nucleus (SCN)',

        color: 0x00b894,
        function: 'Master circadian clock synchronization via direct light signals from retinohypothalamic tract.',
        lesionDeficit: 'Complete loss of endogenous 24-hour circadian sleep-wake rhythmicity.',
        dsm: 'Circadian Rhythm Sleep-Wake Disorders (307.45)',
        icd: '7A60 Circadian rhythm sleep-wake disorders'

    const GAME_CASES = [
      {
        caseText: "A 62-year-old patient presents with resting pill-rolling tremor, severe bradykinesia, and muscle rigidity. Which dopaminergic region is degenerated?",
        targetId: 'substantia_nigra'
      },
      {
        caseText: "A patient exhibits hyperorality, hypersexuality, docility, and total loss of fear responses following encephalitis. Identify the damaged limbic structure.",
        targetId: 'amygdala'
      },
      {
        caseText: "Following severe cerebral anoxia, a patient cannot form any new declarative memories despite intact working memory. Identify the affected region.",
        targetId: 'hippocampus'
      },
      {
        caseText: "A stroke patient speaks fluently with normal rhythm but produces nonsensical sentences ('word salad') and cannot follow spoken commands. Identify the region.",
        targetId: 'wernickes_area'
      },
      {
        caseText: "A patient understands language perfectly but produces non-fluent, halting, painful speech production. Which frontal lobe region is lesioned?",
        targetId: 'brocas_area'
      },
      {
        caseText: "Following a traumatic injury, a patient shows drastic personality shifts: severe disinhibition, poor social decision-making, and moral impairments with intact IQ. Which region is damaged?",
        targetId: 'ventromedial_pfc'
      },
      {
        caseText: "A patient cannot visually recognize the faces of family members (Prosopagnosia) despite normal basic vision. Which ventral stream structure is damaged?",
        targetId: 'fusiform_gyrus'
      }
    ];

    // =========================================================================
    // 2. SCENE & RENDERER SETUP
    // =========================================================================
    let scene, camera, renderer, controls;
    let regionMeshes = [];
    let selectedRegion = null;
    let currentMode = 'explore';
    let currentCaseIndex = 0;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 2, 7);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.4);
      dirLight2.position.set(-5, -5, -5);
      scene.add(dirLight2);

      buildBrainCortexMesh();
      buildBrainRegions();
      populateDropdown();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onPointerClick);

      animate();
    }

    function buildBrainCortexMesh() {
      const geo = new THREE.SphereGeometry(2.0, 32, 32);
      geo.scale(1.0, 0.8, 1.2);
      const mat = new THREE.MeshPhongMaterial({
        color: 0x475569,
        transparent: true,
        opacity: 0.12,
        wireframe: true
      });
      const cortex = new THREE.Mesh(geo, mat);
      scene.add(cortex);
    }

    function buildBrainRegions() {
      BRAIN_REGIONS.forEach(data => {
        const geo = new THREE.SphereGeometry(0.5, 24, 24);
        geo.scale(data.scale[0], data.scale[1], data.scale[2]);

        const mat = new THREE.MeshStandardMaterial({
          color: data.color,
          roughness: 0.3,
          metalness: 0.1,
          transparent: true,
          opacity: 0.85
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...data.pos);
        mesh.userData = { ...data, isLesioned: false, originalColor: data.color };

        scene.add(mesh);
        regionMeshes.push(mesh);
      });
    }

    function populateDropdown() {
      const select = document.getElementById('region-select');
      BRAIN_REGIONS.forEach(region => {
        const opt = document.createElement('option');
        opt.value = region.id;
        opt.textContent = region.name;
        select.appendChild(opt);
      });
    }

    // =========================================================================
    // 3. INTERACTION & SELECTION
    // =========================================================================
    function onPointerClick(event) {
      if (event.clientY < 80 && event.clientX < 420) return;
      if (event.clientX > window.innerWidth - 400) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(regionMeshes);

      if (intersects.length > 0) {
        selectRegionMesh(intersects[0].object);
      }
    }

    window.onSelectDropdown = function(regionId) {
      if (!regionId) return;
      const mesh = regionMeshes.find(m => m.userData.id === regionId);
      if (mesh) {
        selectRegionMesh(mesh);
        // Focus camera on chosen region
        controls.target.copy(mesh.position);
      }
    };

    function selectRegionMesh(mesh) {
      if (selectedRegion && !selectedRegion.userData.isLesioned) {
        selectedRegion.material.color.setHex(selectedRegion.userData.originalColor);
      }

      selectedRegion = mesh;

      if (!selectedRegion.userData.isLesioned) {
        selectedRegion.material.color.setHex(0xffffff);
      }

      document.getElementById('region-select').value = selectedRegion.userData.id;
      displayStructureInfo(selectedRegion.userData);

      if (currentMode === 'game') {
        checkGameAnswer(selectedRegion.userData.id);
      }
    }

    function displayStructureInfo(data) {
      document.getElementById('struct-name').innerText = data.name;
      document.getElementById('struct-desc').innerText = data.function;

      const badge = document.getElementById('status-badge');
      const dsmBox = document.getElementById('dsm-container');
      const icdBox = document.getElementById('icd-container');
      const clinicalBlock = document.getElementById('clinical-block');
      const actionControls = document.getElementById('action-controls');
      const btnLesion = document.getElementById('btn-toggle-lesion');

      // Diagnostic details
      dsmBox.style.display = data.dsm ? "block" : "none";
      document.getElementById('dsm-text').innerText = data.dsm || "";

      icdBox.style.display = data.icd ? "block" : "none";
      document.getElementById('icd-text').innerText = data.icd || "";

      if (data.isLesioned) {
        badge.className = "badge badge-lesion";
        badge.innerText = "LESION ACTIVE";
        clinicalBlock.style.display = "block";
        document.getElementById('struct-clinical').innerText = data.lesionDeficit;
        btnLesion.innerText = "Heal / Remove Lesion";
      } else {
        badge.className = "badge badge-normal";
        badge.innerText = "Healthy State";
        clinicalBlock.style.display = currentMode === 'lesion' ? "block" : "none";
        document.getElementById('struct-clinical').innerText = "Apply a virtual lesion to simulate tissue damage and observe symptom profiles.";
        btnLesion.innerText = "Apply Virtual Lesion";
      }

      actionControls.style.display = currentMode === 'lesion' ? "block" : "none";
    }

    window.toggleCurrentLesion = function() {
      if (!selectedRegion) return;
      
      const isLesioned = !selectedRegion.userData.isLesioned;
      selectedRegion.userData.isLesioned = isLesioned;

      if (isLesioned) {
        selectedRegion.material.color.setHex(0x333333);
        selectedRegion.material.opacity = 0.4;
      } else {
        selectedRegion.material.color.setHex(selectedRegion.userData.originalColor);
        selectedRegion.material.opacity = 0.85;
      }

      displayStructureInfo(selectedRegion.userData);
    };

    window.setMode = function(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-selector button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');

      document.getElementById('game-banner').classList.toggle('active', mode === 'game');

      if (selectedRegion) {
        displayStructureInfo(selectedRegion.userData);
      }

      if (mode === 'game') {
        currentCaseIndex = 0;
        loadGameCase();
      }
    };

    function loadGameCase() {
      const c = GAME_CASES[currentCaseIndex];
      document.getElementById('game-case-text').innerText = `Case #${currentCaseIndex + 1}: ${c.caseText}`;
      document.getElementById('game-feedback').innerText = "";
    }

    function checkGameAnswer(clickedId) {
      const c = GAME_CASES[currentCaseIndex];
      const feedback = document.getElementById('game-feedback');

      if (clickedId === c.targetId) {
        feedback.style.color = "#2ecc71";
        feedback.innerText = "✓ Correct Diagnosis! Target region identified.";
      } else {
        feedback.style.color = "#ef4444";
        feedback.innerText = "✗ Incorrect region. Review symptoms and try again.";
      }
    }

    window.nextGameCase = function() {
      currentCaseIndex = (currentCaseIndex + 1) % GAME_CASES.length;
      loadGameCase();
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (selectedRegion) {
        selectedRegion.rotation.y += 0.01;
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
