<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEUROMAP | Multi-Tier Anatomical Drill-Down</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --accent: #6366f1;
      --text: #f8fafc;
      --sub: #94a3b8;
    }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
    
    .panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 380px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      z-index: 10;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .tier-indicator {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 15px;
      width: 100%;
    }
    .btn:hover { background: #4f46e5; }
    .bread-crumb { font-size: 0.8rem; color: var(--sub); margin-bottom: 8px; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="panel">
    <div id="breadcrumb" class="bread-crumb">Path: Cranium</div>
    <div id="tier-badge" class="tier-indicator">Depth Tier 1: Outer Cranium</div>
    <h2 id="layer-title" style="margin:0 0 10px 0; color: var(--accent);">Skull (Cranium)</h2>
    <p id="layer-desc" style="color: var(--sub); font-size: 0.9rem; line-height: 1.5;">
      Click directly on the skull in the 3D space to peel away the cranial bone and expose the inner meningeal layers.
    </p>

    <!-- Deep Region Information Panel -->
    <div id="sub-details" style="display: none; border-top: 1px solid #334155; margin-top: 15px; padding-top: 15px; font-size: 0.88rem;">
      <p><strong>Brodmann Area:</strong> <span id="info-ba" style="color: #38bdf8;">-</span></p>
      <p><strong>Primary Function:</strong> <span id="info-func">-</span></p>
      <p><strong>Clinical Deficit:</strong> <span id="info-deficit" style="color: #f43f5e;">-</span></p>
      <p><strong>DSM-5 Criteria:</strong> <span id="info-dsm" style="color: #a7f3d0;">-</span></p>
    </div>

    <button id="back-btn" class="btn" style="display: none;" onclick="navigateUpTier()">← Move Up Outer Layer</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
