<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neuromap - Master Neuroanatomy & Neuropsychology Atlas</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #0f172a; color: #f8fafc; }
    #container { display: flex; width: 100%; max-width: 1100px; gap: 20px; margin-top: 10px; }
    
    #brain-viewer { position: relative; width: 560px; height: 420px; background: #1e293b; border-radius: 12px; padding: 10px; border: 1px solid #334155; }
    
    .brain-region { transition: opacity 0.2s ease, filter 0.2s ease, stroke-width 0.2s ease; }
    .brain-region:hover { opacity: 1 !important; filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.9)); }
    .brain-region.selected { opacity: 1 !important; stroke: #ffffff !important; stroke-width: 3px !important; filter: drop-shadow(0px 0px 12px #38bdf8); }

    #info-panel { flex: 1; padding: 20px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    .badge { background: #312e81; color: #c7d2fe; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin-right: 6px; }
    .deficit-box { background: #450a0a; border-left: 4px solid #ef4444; padding: 12px; margin-top: 16px; border-radius: 4px; }
    
    button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <h1>Neuromap</h1>
  <p style="color: #94a3b8; margin-top: -10px;">Comprehensive Neuroanatomy & Clinical Neuropsychology Atlas</p>

  <div style="display: flex; align-items: center; gap: 12px;">
    <button id="mode-btn" onclick="toggleMode()">Switch to Quiz Mode</button>
    <div id="quiz-banner" style="display: none; background: #0284c7; padding: 8px 16px; border-radius: 6px; font-weight: 500;">
      <span id="quiz-question">Question loading...</span> | <strong>Score: <span id="quiz-score">0</span></strong>
    </div>
  </div>

  <div id="container">
    <div id="brain-viewer">
      <svg viewBox="0 0 500 380" width="100%" height="100%">
        <!-- Cerebrum Silhouette -->
        <path d="M 50,180 C 40,80 180,20 320,30 C 420,40 470,120 460,200 C 450,260 380,280 340,280 C 310,280 280,250 250,250 C 180,250 140,270 90,240 C 60,220 50,200 50,180 Z" fill="#334155" stroke="#64748b" stroke-width="2" />

        <!-- Prefrontal Cortex -->
        <path class="brain-region" data-id="prefrontal-cortex" d="M 60,150 Q 80,70 160,80 Q 120,140 60,150 Z" fill="#10b981" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Broca's Area -->
        <path class="brain-region" data-id="brocas-area" d="M 120,140 Q 150,120 170,150 Q 150,180 120,160 Z" fill="#3b82f6" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Primary Motor Cortex (Precentral Gyrus) -->
        <path class="brain-region" data-id="primary-motor-cortex" d="M 175,70 L 195,65 L 185,180 L 165,175 Z" fill="#ef4444" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Primary Somatosensory Cortex (Postcentral Gyrus) -->
        <path class="brain-region" data-id="primary-somatosensory-cortex" d="M 200,65 L 220,68 L 210,180 L 190,180 Z" fill="#f97316" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Posterior Parietal Cortex -->
        <path class="brain-region" data-id="posterior-parietal-cortex" d="M 225,69 Q 320,60 360,120 Q 300,170 215,170 Z" fill="#a855f7" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Primary Visual Cortex -->
        <path class="brain-region" data-id="primary-visual-cortex" d="M 400,160 Q 450,180 430,220 Q 380,210 400,160 Z" fill="#f59e0b" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Wernicke's Area -->
        <path class="brain-region" data-id="wernickes-area" d="M 280,160 Q 320,150 340,180 Q 300,210 270,180 Z" fill="#8b5cf6" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Primary Auditory Cortex -->
        <path class="brain-region" data-id="primary-auditory-cortex" d="M 240,170 Q 270,160 270,185 Q 240,195 240,170 Z" fill="#06b6d4" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Inferior Temporal / Fusiform Cortex -->
        <path class="brain-region" data-id="inferior-temporal-cortex" d="M 180,210 Q 260,220 330,220 Q 280,250 180,240 Z" fill="#e11d48" opacity="0.65" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Arcuate Fasciculus -->
        <path class="brain-region" data-id="arcuate-fasciculus" d="M 170,150 Q 220,110 280,160" fill="none" stroke="#ec4899" stroke-width="5" stroke-dasharray="4,4" style="cursor: pointer;" />

        <!-- Deep Limbic / Subcortical Structures -->
        <!-- Hippocampus -->
        <path class="brain-region" data-id="hippocampus-limbic" d="M 230,200 C 250,190 270,200 260,215 C 240,215 225,210 230,200 Z" fill="#84cc16" opacity="0.85" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Amygdala -->
        <circle class="brain-region" data-id="amygdala" cx="215" cy="200" r="10" fill="#dc2626" opacity="0.85" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Thalamus -->
        <ellipse class="brain-region" data-id="thalamus" cx="240" cy="165" rx="16" ry="12" fill="#eab308" opacity="0.85" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Basal Ganglia -->
        <path class="brain-region" data-id="basal-ganglia" d="M 200,150 C 200,130 230,130 240,145 C 220,155 205,155 200,150 Z" fill="#14b8a6" opacity="0.85" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Cerebellum -->
        <path class="brain-region" data-id="cerebellum" d="M 330,255 C 380,250 420,280 390,340 C 330,340 310,300 330,255 Z" fill="#6366f1" opacity="0.75" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />

        <!-- Brainstem -->
        <path class="brain-region" data-id="brainstem" d="M 260,250 L 295,250 L 285,350 L 255,350 Z" fill="#64748b" opacity="0.85" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;" />
      </svg>
    </div>

    <!-- Details Display Panel -->
    <div id="info-panel">
      <h2 id="region-name" style="margin-top: 0;">Select a Brain Region</h2>
      <p><span id="region-lobe" class="badge">Lobe / System</span> <span id="region-ba" class="badge">Brodmann Area</span></p>
      <hr style="border-color: #334155;">
      <h3>Neuropsychological Function</h3>
      <p id="region-function" style="color: #cbd5e1;">Click any region on the map to display its core functions and clinical deficits.</p>
      
      <div class="deficit-box">
        <strong id="deficit-title" style="color: #fca5a5;">Clinical Deficit / Syndrome</strong>
        <p id="deficit-desc" style="margin: 6px 0 0 0; color: #fecaca;">N/A</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
</body>
</html>
</body>
</html>
