<header class="neuromap-hero">
  <div class="hero-container">
    
    <!-- Left Column: Branding & Controls -->
    <div class="hero-content">
      <span class="badge-pill">Neuroanatomy & Diagnostic Platform</span>
      <h1 class="hero-title">NeuroMap <span>3D</span></h1>
      <p class="hero-subtitle">
        Explore interactive 3D human brain anatomy mapped to clinical lesion profiles, 
        DSM-5-TR & ICD-11 classifications, and functional neural networks.
      </p>

      <!-- Capability Tags -->
      <div class="feature-tags">
        <span class="tag"><i class="icon">🧠</i> 3D Brain Viewer</span>
        <span class="tag"><i class="icon">📑</i> DSM-5-TR / ICD-11</span>
        <span class="tag"><i class="icon">⚡</i> Network Overlays</span>
        <span class="tag"><i class="icon">🔍</i> Symptom Lookup</span>
      </div>

      <!-- Action Buttons -->
      <div class="hero-actions">
        <button id="btn-launch-explorer" class="btn btn-primary">
          Launch 3D Explorer
        </button>
        <button id="btn-clinical-challenge" class="btn btn-secondary">
          Clinical Challenge 🎮
        </button>
      </div>

      <!-- Quick Search Bar -->
      <div class="hero-search">
        <input 
          type="text" 
          id="hero-quick-search" 
          placeholder="Search region (e.g. Broca's Area), symptom, or network..."
        />
      </div>
    </div>

    <!-- Right Column: Interactive / Visual Preview -->
    <div class="hero-preview">
      <div id="hero-3d-canvas-container">
        <!-- Embedded canvas showing auto-rotating brain or preview model -->
      </div>
    </div>

  </div>
</header>
